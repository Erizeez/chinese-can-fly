name: ChineseCanFly
options:
  bundleIdPrefix: com.erizeez
  deploymentTarget:
    iOS: "17.0"
packages:
  CCFlyCore:
    path: ./CCFlyCore
configs:
  Debug: debug
  Release: release
targets:
  ChineseCanFly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
    info:
      path: App/Info.plist
    configFiles:
      Debug: Configuration/Signing.xcconfig
      Release: Configuration/Signing.xcconfig
    dependencies:
      - package: CCFlyCore
    settings:
      base:
        PRODUCT_NAME: "ChineseCanFly"
        PRODUCT_BUNDLE_IDENTIFIER: "com.erizeez.ChineseCanFly"
        INFOPLIST_FILE: "App/Info.plist"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        TARGETED_DEVICE_FAMILY: "1,2"
